<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Question Bank & Practice Quiz</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for clean vector icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

.question-image-container {
    text-align: center;
    margin: 15px 0;
}

.question-img {
    max-width: 100%;
    height: auto;
    max-height: 300px; /* Adjust height limit as preferred */
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 5px;
    background-color: #fff;
}
        
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700">

<!-- Header Bar -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button id="mobile-menu-btn" class="md:hidden text-slate-500 hover:text-slate-700 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-100 flex items-center justify-center">
                <i class="fa-solid fa-graduation-cap text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-900 leading-tight">Mastery Question Bank</h1>
                <p class="text-xs text-slate-500 hidden sm:block">Self-Paced MCQ Practice Engine</p>
            </div>
        </div>

        <!-- Overall Progress Stats Bar -->
        <div class="flex items-center space-x-4">
            <div class="hidden sm:flex items-center space-x-6 bg-slate-50 border border-slate-200 px-4 py-1.5 rounded-xl text-xs">
                <div>
                    <span class="text-slate-400 block">Total Answered</span>
                    <span id="global-total-answered" class="font-semibold text-slate-700">0 / 0</span>
                </div>
                <div class="h-6 w-px bg-slate-200"></div>
                <div>
                    <span class="text-slate-400 block">Accuracy</span>
                    <span id="global-accuracy" class="font-semibold text-indigo-600">0%</span>
                </div>
            </div>

            <button id="reset-progress-btn" class="text-xs text-slate-500 hover:text-rose-600 px-3 py-2 rounded-lg border border-slate-200 hover:border-rose-200 hover:bg-rose-50 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-rotate-left"></i>
                <span class="hidden md:inline">Reset Progress</span>
            </button>
        </div>
    </div>
</header>

<!-- Main Content Area -->
<div class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto">
    <!-- Sidebar Navigation for Topics -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-white border-r border-slate-200 transform -translate-x-full md:translate-x-0 md:static transition-transform duration-200 ease-in-out flex flex-col">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Topics & Chapters</span>
            <span id="topic-count-badge" class="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-medium">0 Topics</span>
        </div>
        
        <nav id="topic-list" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1">
            <!-- Dynamic Topics Rendered via JS -->
        </nav>

        <div class="p-4 bg-slate-50 border-t border-slate-200 text-xs text-slate-500">
            <i class="fa-solid fa-circle-info text-indigo-500 mr-1"></i> Auto-saves your responses automatically in your browser.
        </div>
    </aside>

    <!-- Overlay for Mobile Sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 hidden md:hidden"></div>

    <!-- Main Quiz View Container -->
    <main class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 lg:p-8 bg-slate-50">
        <div class="max-w-4xl mx-auto space-y-6">

            <!-- Active Topic Summary Header -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <div class="flex items-center space-x-2">
                        <span id="current-topic-badge" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded-md">Topic 1</span>
                        <span id="current-topic-total-q" class="text-xs text-slate-400">0 Questions</span>
                    </div>
                    <h2 id="current-topic-title" class="text-xl font-bold text-slate-900 mt-1">Select a Topic</h2>
                    <p id="current-topic-desc" class="text-sm text-slate-500 mt-0.5">Select a module from the sidebar to start practicing.</p>
                </div>

                <!-- Topic Progress Ring / Bar -->
                <div class="flex items-center space-x-4 bg-slate-50 p-3 rounded-xl border border-slate-100 min-w-[200px]">
                    <div class="flex-1">
                        <div class="flex justify-between text-xs font-medium mb-1">
                            <span class="text-slate-500">Topic Progress</span>
                            <span id="topic-progress-text" class="text-slate-700">0%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div id="topic-progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300 w-0"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls & Filters Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-3 bg-white px-4 py-3 rounded-xl border border-slate-200/80 shadow-sm text-sm">
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-medium text-slate-500"><i class="fa-solid fa-filter mr-1"></i> View:</span>
                    <button id="filter-all-btn" class="filter-btn active text-xs font-medium px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 transition">All</button>
                    <button id="filter-incorrect-btn" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 transition">Incorrect</button>
                    <button id="filter-unanswered-btn" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 transition">Unanswered</button>
                </div>

                <div class="flex items-center space-x-2">
                    <button id="randomize-btn" class="text-xs font-medium px-3 py-1.5 rounded-lg text-slate-600 border border-slate-200 hover:bg-slate-50 transition flex items-center space-x-1">
                        <i class="fa-solid fa-shuffle"></i>
                        <span>Shuffle</span>
                    </button>
                    <button id="submit-topic-btn" class="text-xs font-semibold px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
                        Submit All & Grade
                    </button>
                </div>
            </div>

            <!-- Questions Container -->
            <div id="questions-list" class="space-y-6">
                <!-- Question cards generated dynamically -->
            </div>

        </div>
    </main>
</div>

<!-- 1. External Topic Data Scripts -->
<script src="js/experimental-chemistry.js"></script>
<script src="js/separation-techniques.js"></script>
<script src="js/kinetic-particle-theory.js"></script>
    
<!-- 2. Main External App Logic -->
<!-- Ensure your JS filename matches this path (e.g., js/app.js) -->
<script src="js/app.js"></script>

</body>
</html>
